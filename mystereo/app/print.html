<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>J-Card</title>
<body style="margin:0;padding:28px 20px;font:18px/1.45 -apple-system,'Helvetica Neue',Arial,sans-serif;color:#222;background:#fff">
<p id="msg">Opening your J-card…</p>
<script>
/* Flipside / myStereo: the J-card print page. The card rides in the link (squeezed), so nothing is stored or sent anywhere.
   iPhone home-screen apps can't print, so the app opens this page in Safari's sheet, where the Print button below works. */
(async function () {
  try {
    var h = location.hash.slice(1); if (!h) throw 0;
    var z = h.charAt(0) === 'z', s = h.slice(1).replace(/-/g, '+').replace(/_/g, '/');
    var bin = atob(s), b = new Uint8Array(bin.length); for (var i = 0; i < bin.length; i++) b[i] = bin.charCodeAt(i);
    var html = z ? await new Response(new Blob([b]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).text() : new TextDecoder().decode(b);
    document.open(); document.write(html); document.close();
    var add = function () {
      var st = document.createElement('style');
      st.textContent = '.jc-bar{display:flex;gap:12px;margin:0 0 16px}.jc-bar button{flex:1;height:56px;border:0;border-radius:14px;font:700 20px -apple-system,"Helvetica Neue",Arial,sans-serif;cursor:pointer}.jc-bar .p{background:#c8372d;color:#fff}.jc-bar .x{background:#e9e4da;color:#222}@media print{.jc-bar{display:none!important}}';
      document.head.appendChild(st);
      var bar = document.createElement('div'); bar.className = 'jc-bar';
      bar.innerHTML = '<button type="button" class="p">Print</button><button type="button" class="x">Done</button>';
      bar.querySelector('.p').onclick = function () { window.print(); };
      bar.querySelector('.x').onclick = function () { if (history.length > 1) history.back(); else window.close(); };
      document.body.insertBefore(bar, document.body.firstChild);
    };
    if (document.body) add(); else addEventListener('DOMContentLoaded', add);
  } catch (e) { document.getElementById('msg').textContent = 'This J-card didn’t come through. Close this and press Print again.'; }
})();
</script>
