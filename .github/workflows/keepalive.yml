# Keeps the myShelf database (Supabase, free plan) from pausing after 7 quiet days.
# Supabase counts database requests, so this reads one row through the API.
# It backs up the pg_cron job inside Supabase (keepalive_ping, every 3 days).
# The publishable key is public by design (it's also in myshelf/index.html).
name: keep-alive
on:
  schedule:
    - cron: '17 9 */2 * *'   # every other day, 09:17 UTC
  workflow_dispatch:
permissions: {}
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Read the newest keepalive row
        run: |
          code=$(curl -sS -o body.json -w '%{http_code}' \
            "https://pknnhharadotkdvvkdoh.supabase.co/rest/v1/keepalive?select=pinged_at&order=pinged_at.desc&limit=1" \
            -H "apikey: sb_publishable_2Fw-nRJT74bovs1JSTBx_Q_zR-DgCPm")
          cat body.json; echo
          [ "$code" = 200 ] || { echo "::error::Supabase answered $code. The project may be paused; restore it in the dashboard."; exit 1; }
